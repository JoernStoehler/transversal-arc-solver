[package]
name = "ablations"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
faer = "0.20"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
